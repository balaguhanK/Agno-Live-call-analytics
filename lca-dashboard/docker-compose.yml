# Local FreeSWITCH, Redis and PostgreSQL for LCA development.
# Values come from .env in this folder. Start with: docker compose up -d

services:
  freeswitch:
    image: safarov/freeswitch:latest
    restart: unless-stopped
    environment:
      SOUND_RATES: "8000:16000"
      SOUND_TYPES: "music:en-us-callie"
      FREESWITCH_ESL_PASSWORD: ${FREESWITCH_ESL_PASSWORD:?set FREESWITCH_ESL_PASSWORD in .env}
    ports:
      - "${FREESWITCH_SIP_PORT}:5060/udp"
      - "${FREESWITCH_SIP_PORT}:5060/tcp"
      - "${FREESWITCH_SIPREC_PORT}:5080/udp"
      - "${FREESWITCH_SIPREC_PORT}:5080/tcp"
      - "127.0.0.1:${FREESWITCH_ESL_PORT}:8021/tcp"
      - "${FREESWITCH_RTP_START_PORT}-${FREESWITCH_RTP_END_PORT}:16384-16484/udp"
    volumes:
      - ./docker/freeswitch/event_socket.conf.xml:/etc/freeswitch/autoload_configs/event_socket.conf.xml:ro
      - ./docker/freeswitch/switch.conf.xml:/etc/freeswitch/autoload_configs/switch.conf.xml:ro
      - freeswitch-sounds:/usr/share/freeswitch/sounds
      - freeswitch-recordings:/var/lib/freeswitch/recordings

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env}
    ports:
      - "127.0.0.1:${PGPORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  freeswitch-sounds:
  freeswitch-recordings:
  redis-data:
  postgres-data:
